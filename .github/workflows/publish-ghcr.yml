# Build + publish the Cognis Knowledge image (Dockerfile.cognis) to GHCR.
#
# Registry/name per the founder decision record (DECISIONS-2026-06-11, AC-5)
# and the deployment map's image table (cognis-platform/docs/plans/build/
# deployment-map.md §1.7 + §4.1): the knowledge pipeline publishes
# ghcr.io/cognis-ai/knowledge (the GHCR counterpart of the local
# cognis/knowledge:dev image) tagged :<git-sha> and :<semver>; Coolify apps
# reference DIGESTS, not tags, so the pushed digest is surfaced as the
# deployable artifact.
#
# Base-image risk (knowledge AR-4 / theming-spec B6): infiniflow/ragflow:dev-slim
# is a moving tag — Dockerfile.cognis pins it by sha256 digest, so this build
# is reproducible without any extra pinning here.
name: Publish to GHCR

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cognis-ai/knowledge

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # Gate 2 condition on theming-spec B3.1: the in-image service-conf
      # shadow template must not drift from upstream outside its marked smtp
      # region. Fail the publish before spending a build on a bad template.
      - name: Check service-conf template drift (B3.1 gate)
        run: python tools/check_conf_template_drift.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cognis
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Coolify references digests, not tags (deployment map §4.1).
      - name: Surface the deployable digest
        run: |
          echo "### ghcr.io/cognis-ai/knowledge" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
